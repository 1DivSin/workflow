name: Codex PR101 live smoke

on:
  push:
    branches:
      - test/codex-pr101-live-smoke

permissions:
  contents: read

jobs:
  codex-live-smoke:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - workflow-e2e
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install Workflow dependencies
        shell: pwsh
        run: uv sync --python 3.12

      - name: Run PR101 Program-Agent-Human smoke through real Codex MCP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $codex = "C:\Users\aa\AppData\Local\Programs\OpenAI\Codex\bin\codex.exe"
          & $codex --version
          if ($LASTEXITCODE -ne 0) {
            throw "Codex version check failed"
          }

          $work = Join-Path $env:RUNNER_TEMP "workflow-pr101-live-$env:GITHUB_RUN_ID"
          if (Test-Path $work) {
            Remove-Item -Recurse -Force $work
          }
          $flowDir = Join-Path $work "flows\workflows\workflow-smoke"
          New-Item -ItemType Directory -Force -Path $flowDir | Out-Null

          @'
          import json
          import sys
          from pathlib import Path

          payload = json.load(sys.stdin)
          numbers = payload["inputs"]["numbers"]

          counter = Path(__file__).with_name("program-runs.txt")
          previous = counter.read_text(encoding="utf-8") if counter.exists() else ""
          counter.write_text(previous + "1\n", encoding="utf-8")

          print(json.dumps({"count": len(numbers), "sum": sum(numbers)}, ensure_ascii=False))
          '@ | Set-Content -Encoding UTF8 (Join-Path $flowDir "sum_numbers.py")

          @'
          const numbers: Artifact;
          const calculation: Artifact;
          const checked: Artifact;
          const decision: Artifact;

          const calculate: Step;
          const verify: Step;
          const approval: Step;

          const calculator: Program, Executor;
          const checker: Agent, Executor;
          const reviewer: Human, Executor;

          workflow workflow_smoke {
            input_workflow(workflow_smoke) == [numbers];

            consumes(calculate) == [numbers];
            produces(calculate) == [calculation];

            consumes(verify) == [numbers, calculation];
            produces(verify) == [checked];

            consumes(approval) == [calculation, checked];
            produces(approval) == [decision];

            output_workflow(workflow_smoke) == [calculation, checked, decision];

            step_executor(calculate) == calculator;
            step_executor(verify) == checker;
            step_executor(approval) == reviewer;

            program_path(calculator) == "./flows/workflows/workflow-smoke/sum_numbers.py";

            step_name(calculate) == "Calculate";
            step_instruction(calculate) == "Run the declared Python program exactly once. It must compute count and sum from the numbers input and submit the captured stdout without changing the input.";

            step_name(verify) == "Verify";
            step_instruction(verify) == "Check that calculation reports count 3 and sum 6 for the numbers input. Return checked as a concise verification string; if the values cannot be verified, return checked as unverifiable.";

            step_name(approval) == "Approval";
            step_instruction(approval) == "Ask whether to accept this calculation result. Offer exactly two options: accept and recalculate. Recommend accept only when checked is verified.";

            step_timeout(calculate) == 600;
            step_timeout(verify) == 600;
            workflow_timeout(workflow_smoke) == 900;
            max_concurrency(workflow_smoke) == 1;
          }
          '@ | Set-Content -Encoding UTF8 (Join-Path $flowDir "workflow-smoke.workflow")

          # Isolate this live test from the runner's normal Codex config while
          # reusing the runner's authenticated root-level Codex credential files.
          $realCodexHome = Join-Path $env:USERPROFILE ".codex"
          $testCodexHome = Join-Path $work ".codex"
          New-Item -ItemType Directory -Force -Path $testCodexHome | Out-Null
          if (Test-Path $realCodexHome) {
            Get-ChildItem $realCodexHome -File |
              Where-Object { $_.Name -ne "config.toml" } |
              Copy-Item -Destination $testCodexHome
          }

          $env:CODEX_HOME = $testCodexHome
          $env:CODEX_CONFIG = Join-Path $testCodexHome "config.toml"
          $env:CODEX_SKILLS_DIR = Join-Path $work ".agents\skills"
          $env:CODEX_EXECUTABLE = $codex
          $env:PSI_WORKFLOW_HOST = "codex"
          $env:PSI_WORKFLOW_WORKSPACE = $work
          $env:PSI_WORKFLOW_STATE_DIR = Join-Path $work ".workflow-state"
          $env:PSI_WORKFLOW_TOOLS_DIR = Join-Path $work ".workflow-tools"
          $env:PATH = "$(Split-Path $codex);$env:PATH"

          uv run dynamic-workflow install . --host codex --workspace $work
          if ($LASTEXITCODE -ne 0) {
            throw "Workflow Codex installation failed"
          }

          $config = Get-Content -Raw $env:CODEX_CONFIG
          Write-Host "===== ISOLATED CODEX CONFIG ====="
          Write-Host $config
          if ($config -notmatch "tool_timeout_sec\s*=\s*900") {
            throw "PR101 tool_timeout_sec=900 was not installed"
          }

          $prompt = @'
          Call the run_flow tool from the fusion_flow MCP server exactly once.
          Use flow_path "flows/workflows/workflow-smoke/workflow-smoke.workflow".
          Use inputs_json "{\"numbers\":[1,2,3]}".
          Do not edit files, do not create another workflow, and do not call run_flow a second time.
          When the tool returns, report its returned result and stop.
          '@

          Push-Location $work
          try {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            $codexOutput = & $codex exec $prompt 2>&1 | Out-String
            $codexExit = $LASTEXITCODE
            $watch.Stop()
          }
          finally {
            Pop-Location
          }

          Write-Host "===== CODEX OUTPUT ====="
          Write-Host $codexOutput
          Write-Host ("CODEX_EXEC_ELAPSED_SECONDS={0:N1}" -f $watch.Elapsed.TotalSeconds)

          if ($codexExit -ne 0) {
            throw "Codex live Workflow call failed with exit code $codexExit"
          }

          $runFiles = @(
            Get-ChildItem $env:PSI_WORKFLOW_STATE_DIR -Filter "*.json" -File |
              Where-Object { $_.BaseName -match "^[0-9a-f]{32}$" }
          )
          if ($runFiles.Count -ne 1) {
            throw "Expected exactly one Human workflow run state, found $($runFiles.Count)"
          }

          $stateFile = $runFiles[0]
          $state = Get-Content -Raw $stateFile.FullName | ConvertFrom-Json
          Write-Host "===== HUMAN STATE ====="
          Write-Host (Get-Content -Raw $stateFile.FullName)

          if ($state.status -ne "waiting_for_human") {
            throw "Expected waiting_for_human, got $($state.status)"
          }
          if ($null -eq $state.prepared_request) {
            throw "Human request was not prepared"
          }

          $runId = $state.run_id
          $artifactDir = Join-Path $flowDir "runs\$runId\artifacts"
          $calculationFile = Join-Path $artifactDir "calculation.md"
          $checkedFile = Join-Path $artifactDir "checked.md"
          if (-not (Test-Path $calculationFile)) {
            throw "Calculation artifact is missing"
          }
          if (-not (Test-Path $checkedFile)) {
            throw "Checked artifact is missing"
          }

          $calculationRaw = (Get-Content -Raw $calculationFile).Trim()
          Write-Host "===== CALCULATION ARTIFACT ====="
          Write-Host $calculationRaw
          if ($calculationRaw -match "\$fusion_flow/program_error") {
            throw "Program returned a fusion_flow/program_error"
          }
          $calculation = $calculationRaw | ConvertFrom-Json
          if ($calculation.count -ne 3 -or $calculation.sum -ne 6) {
            throw "Unexpected calculation result: $calculationRaw"
          }

          $counterFile = Join-Path $flowDir "program-runs.txt"
          $runsBeforeResume = @(
            Get-Content $counterFile | Where-Object { $_.Trim() -ne "" }
          ).Count
          if ($runsBeforeResume -ne 1) {
            throw "Program executed $runsBeforeResume times before resume"
          }

          $request = $state.prepared_request
          $answer = if ($request.options.Count -gt 0) {
            [string]$request.options[0]
          } elseif ([string]$request.default) {
            [string]$request.default
          } else {
            "accept"
          }

          $resumeScript = Join-Path $work "resume_smoke.py"
          @'
          import asyncio
          import json
          import os
          from pathlib import Path

          from run_flow import run_flow_resume

          result = asyncio.run(
              run_flow_resume(
                  run_id=os.environ["SMOKE_RUN_ID"],
                  request_id=os.environ["SMOKE_REQUEST_ID"],
                  human_response_json=json.dumps(os.environ["SMOKE_ANSWER"], ensure_ascii=False),
              )
          )
          Path(os.environ["SMOKE_RESULT_PATH"]).write_text(result, encoding="utf-8")
          print(result)
          '@ | Set-Content -Encoding UTF8 $resumeScript

          $env:SMOKE_RUN_ID = [string]$runId
          $env:SMOKE_REQUEST_ID = [string]$request.request_id
          $env:SMOKE_ANSWER = $answer
          $env:SMOKE_RESULT_PATH = Join-Path $work "resume-result.json"

          uv run python $resumeScript
          if ($LASTEXITCODE -ne 0) {
            throw "run_flow_resume failed"
          }

          $finalState = Get-Content -Raw $stateFile.FullName | ConvertFrom-Json
          if ($finalState.status -ne "completed") {
            throw "Expected completed after resume, got $($finalState.status)"
          }

          $runsAfterResume = @(
            Get-Content $counterFile | Where-Object { $_.Trim() -ne "" }
          ).Count
          if ($runsAfterResume -ne 1) {
            throw "Program re-executed during resume; count=$runsAfterResume"
          }

          $resumeResult = Get-Content -Raw $env:SMOKE_RESULT_PATH
          Write-Host "===== RESUME RESULT ====="
          Write-Host $resumeResult

          Write-Host "LIVE_SMOKE_OK"
          Write-Host "RUN_ID=$runId"
          Write-Host "HUMAN_QUESTION=$($request.question)"
          Write-Host "HUMAN_ANSWER=$answer"
          Write-Host "PROGRAM_EXECUTIONS=$runsAfterResume"
