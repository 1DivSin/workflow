name: Generated Sources

on:
  push:
  pull_request:

jobs:
  antlr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Install ANTLR tools
        run: pip install antlr4-tools==0.2.2
      - name: Verify generated sources
        run: |
          output=$RUNNER_TEMP/workflow-generated
          mkdir $output
          antlr4 -v 4.13.2 \
            -Dlanguage=Python3 -no-listener -Xexact-output-dir \
            -o $output src/grammar/FusionFlow.g4
          diff -u src/fusion_flow/generated/FusionFlowLexer.py $output/FusionFlowLexer.py
          diff -u src/fusion_flow/generated/FusionFlowParser.py $output/FusionFlowParser.py
