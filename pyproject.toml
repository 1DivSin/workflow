[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-workflow"
version = "0.1.0"
description = "Host agnostic dynamic workflow runtime"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "antlr4-python3-runtime>=4.13.2,<4.14",
    "json-repair>=0.30,<1",
    "loguru>=0.7,<1",
    "websockets>=12",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["run_flow", "flow_manage", "workflow_sample", "_runtime_paths", "_workflow_authoring_context"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion_flow*", "installer*"]
[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.mypy]
python_version = '3.12'
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.data-files]
"share/dynamic-workflow" = ["src/SKILL.md"]
