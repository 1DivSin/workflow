[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-workflow"
version = "0.1.0"
description = "Host agnostic dynamic workflow runtime"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6,<7",
    "anyio>=4.15,<5",
    "antlr4-python3-runtime>=4.13.2,<4.14",
    "json-repair>=0.30,<1",
    "loguru>=0.7,<1",
    "websockets>=12",
]

[project.optional-dependencies]
# Development-only ACP dependency. A discoverable Hermes host should be installed
# separately as `hermes-agent[mcp,acp]`; uv does not expose dependency executables
# from another installed tool on PATH.
hermes = ["hermes-agent[acp]"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["run_flow", "flow_manage", "workflow_sample", "_runtime_paths", "_workflow_authoring_context"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion_flow*", "installer*"]

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.mypy]
python_version = '3.12'
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.data-files]
"share/dynamic-workflow" = ["src/SKILL.md"]
"share/dynamic-workflow/grammar" = ["src/grammar/FusionFlow.g4"]
"share/dynamic-workflow/examples" = [
    "examples/loop_engineering.workflow",
    "examples/react_loop.workflow",
    "examples/terminal_identity.py",
]
"share/dynamic-workflow/openclaw-workflow" = [
    "plugins/openclaw-workflow/index.js",
    "plugins/openclaw-workflow/openclaw.plugin.json",
    "plugins/openclaw-workflow/package.json",
]

[project.scripts]
dynamic-workflow = "installer.cli:main"
dynamic-workflow-mcp = "fusion_flow.mcp_server:main"
dynamic-workflow-tool = "fusion_flow.bridge_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
