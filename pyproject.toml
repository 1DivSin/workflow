[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-workflow"
version = "0.1.0"
description = "Host agnostic dynamic workflow runtime"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["run_flow", "flow_manage", "workflow_sample"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion_flow*", "installer*"]
[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.mypy]
python_version = '3.11'
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.data-files]
"share/dynamic-workflow" = ["src/SKILL.md"]
